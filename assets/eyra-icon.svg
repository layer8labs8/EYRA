<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#11192A"/>
      <stop offset="100%" stop-color="#090C12"/>
    </radialGradient>
    <linearGradient id="eyeStroke" x1="88" y1="160" x2="396" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="65%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="196" y1="196" x2="316" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="395" y1="175" x2="432" y2="337" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Eye aperture -->
  <path
    d="M94 256C134 184 192 152 248 152C304 152 362 184 402 256C362 328 304 360 248 360C192 360 134 328 94 256Z"
    stroke="url(#eyeStroke)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Iris ring -->
  <circle
    cx="248"
    cy="256"
    r="64"
    stroke="url(#irisGrad)"
    stroke-width="24"
    filter="url(#glow)"
  />

  <!-- Precision action spark -->
  <path
    d="M248 228L255.5 248.5L276 256L255.5 263.5L248 284L240.5 263.5L220 256L240.5 248.5Z"
    fill="#E0F2FE"
  />

  <!-- Outer audio wave arc -->
  <path
    d="M398 182C424 205 436 229 436 256C436 283 424 307 398 330"
    stroke="url(#waveGrad)"
    stroke-width="16"
    stroke-linecap="round"
  />
</svg>
